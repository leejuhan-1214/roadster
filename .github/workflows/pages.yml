name: Deploy Roadster to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadster-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependency
        run: npm ci --ignore-scripts
      - name: Check JavaScript and simulator tests
        run: |
          npm run check
          npm test
      - name: Check static entry point and model data
        run: |
          test -s dist/index.html
          test -s dist/assets/tesla-roadster-2020/scene.gltf
          test -s dist/assets/tesla-roadster-2020/scene.bin
          test -s dist/assets/vehicles/ferrari.glb
          test -s dist/assets/vehicles/bmw.glb
          test -s dist/assets/vehicles/ATTRIBUTION.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish simulator
        id: deployment
        uses: actions/deploy-pages@v5
